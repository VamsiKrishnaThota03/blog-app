name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blog_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test (unit + API integration against Postgres)
        run: npm test
        env:
          # Service containers are reachable on localhost from the job runner.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog_test
          DB_SSL: disable
          JWT_SECRET: ci-only-secret-never-used-in-a-deployment
          LOG_LEVEL: silent

      - name: Coverage summary
        if: matrix.node == '20'
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog_test
          DB_SSL: disable
          JWT_SECRET: ci-only-secret-never-used-in-a-deployment
          LOG_LEVEL: silent

  client:
    name: client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Typecheck and build
        # `npm run build` is `tsc -b && vite build`, so this covers typechecking.
        run: npm run build
        env:
          VITE_API_URL: https://blog-api-rer9.onrender.com/api

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: false
          load: true
          tags: blog-app-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image rejects a missing JWT_SECRET
        run: |
          # The container must exit non-zero rather than serve traffic
          # half-configured. `|| true` keeps the step from failing on the
          # expected non-zero exit; the grep below is the real assertion.
          output=$(docker run --rm -e DATABASE_URL=postgresql://x:y@127.0.0.1:1/z \
            blog-app-server:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "JWT_SECRET" \
            || { echo "::error::expected a JWT_SECRET configuration error"; exit 1; }
